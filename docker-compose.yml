version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: myai-postgres
    environment:
      POSTGRES_USER: myai
      POSTGRES_PASSWORD: myai_secret
      POSTGRES_DB: myai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myai -d myai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: myai-redis
    command: redis-server --requirepass myai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myai_redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/MyAi.Api/Dockerfile
    container_name: myai-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=myai;Username=myai;Password=myai_secret"
      ConnectionStrings__Redis: "redis:6379,password=myai_redis"
      Jwt__Issuer: "MyAi"
      Jwt__Audience: "MyAi-Web"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: myai-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
