name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-build:
    name: Frontend (Next.js build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --ci --watchAll=false
      - run: npm run build

  backend-build:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore MyAi.sln
      - run: dotnet build MyAi.sln -c Release --no-restore
      - run: dotnet test MyAi.sln -c Release --no-build --verbosity normal
